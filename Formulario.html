<!DOCTYPE html>  <html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	
	<title> Tabela </title>
	
</head>
	
	<body> 
	
	<form action="/pagina-processa-dados-do-form" method="post">
	
	<fieldset>
	
		<legend> DADOS GERAIS </legend>
		
		<label for="Nome" > NOME: </label>
		
		<input type="text" minlength="3"
		id: "Nome" />
		
		<label for="data_nascimento"> DATA DE NASCIMENTO: </label>
		
		<input type="date"
		id="data_nascimento"
		name="DATA DE NASCIMENTO:"
		max="2026-09-13"
		required
		/>
		
		<label for="cpf"> CPF: </label>
		
		<input type="cpf" minlength="11"
		id: "cpf" />
		
	</fieldset>
		
	<fieldset>
		
		<legend> Endereço </legend>
		
		<label fot="tipo_endereco"> Tipo: </label>
		
	<select id="tipo_endereco">
		
		<option value="">Selecione</option>
		<option value="">Rua</option>
		<option value="">Estrada</option>
		<option value="">Rododia</option>
		<option value="">Outros</option>
		
	</select>
	
	
		<label for="logradouro_enderco"> Logradouro: </label>
	
		<input type:"text"
		id:"logradouro_enderco" />
	
		<label for="complemento_endereco">Complemento: </label>
	
		<input type:"text"
		id:"complemento_endereco" />
		
		<label for="numero_enderco"> Numero: </label>
	
		<input type:"text"
		id:"numero_enderco" />
	</fieldset>

	<fieldset>
	
		
		<legend> Fale conosco </legend>
		
		<label for="Msg"> Mensagem: </label>
		
	<textarea type:"text"
		id: "Msg">
	</textarea>

	</fieldset>
	
	
	<fieldset>
	
		<button type="Submit"> Enviar sua Mensagem </button>
		<button type="reset"> Limpar o Formulario </button>
	
	</fieldset>
	</form>
